packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: false

allowBuilds:
  esbuild: true

catalogMode: prefer
cleanupUnusedCatalogs: true

catalog:
  "@playwright/test": ^1.62.1
  "@tanstack/devtools": 0.14.0
  "@tanstack/history": 1.162.1
  "@tanstack/router-core": 1.171.21
  "@tanstack/store": 0.11.1
  postcss: ^8.5.26
  tailwindcss: ^4.3.3
  vite: 8.2.1

catalogs:
  node20:
    "@types/node": ^20.19.43
  node22:
    "@types/node": ^22.20.1
  node24:
    "@types/node": ^24.13.3

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

packageExtensions:
  # @tanstack/devtools 0.14.0 imports @neodrag/core without declaring it.
  "@tanstack/devtools@0.14.0":
    dependencies:
      "@neodrag/core": 3.0.0-next.11

overrides:
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1

update:
  githubActions: true
