core:changelogs:
  - content: "---\npackages:\n  \"@bgub/fig\":\n    type: minor\n  \"@bgub/fig-server\":\n    type: minor\n---\n\n## Preserve Activity boundaries through Payload\n\nServer components can return Activity boundaries whose modes, keys, and nested children survive Payload decoding. Hidden content remains hidden during subsequent HTML and client rendering.\n"
    filename: activity-payload.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@bgub/fig-reconciler\":\n    type: minor\n---\n\n## Independent transition scheduling\n\nReady transitions can commit while unrelated transitions in the same root are suspended. Transitions sharing a state queue stay coordinated, preserving related updates and View Transition coalescing. Async continuation attribution is unchanged.\n"
    filename: independent-transitions.md
    v: 0.0.0
